<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Channel Log — Walkie Tracker</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Channel Log">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#12161d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12161d;
    --panel:#1a2029;
    --panel-2:#212836;
    --line:#2a3242;
    --text:#eef1f6;
    --muted:#8b96a8;
    --signal:#33d17a;
    --signal-dim:#1c4a33;
    --out:#ffb020;
    --out-dim:#4a3a14;
    --danger:#ff5c5c;
    --accent:#4da3ff;
    --mono:'Share Tech Mono', monospace;
    --sans:'Inter', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans);
    overscroll-behavior:none;
    padding-bottom:env(safe-area-inset-bottom);
  }
  #app{max-width:720px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}

  header{
    padding:16px 16px 12px; position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, var(--bg) 70%, transparent);
  }
  .brand{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .brand-left{display:flex; align-items:center; gap:10px;}
  .dot{width:10px;height:10px;border-radius:50%; background:var(--signal); box-shadow:0 0 8px var(--signal); animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1} 50%{opacity:.4}}
  .brand h1{font-size:15px; letter-spacing:.14em; text-transform:uppercase; font-weight:700; margin:0; color:var(--muted);}
  .settings-btn{background:none; border:1px solid var(--line); color:var(--muted); width:34px; height:34px; border-radius:9px; font-size:16px; cursor:pointer;}

  .stats{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
  .stat{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 8px; text-align:center;}
  .stat .num{font-family:var(--mono); font-size:26px; font-weight:700; line-height:1;}
  .stat .lbl{font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-top:4px;}
  .stat.avail .num{color:var(--signal);}
  .stat.out .num{color:var(--out);}

  .event-bar{display:flex; gap:8px; padding:12px 16px 0; align-items:center;}
  .event-select{flex:1; background:var(--panel); border:1px solid var(--line); color:var(--text); padding:10px 12px; border-radius:10px; font-family:var(--sans); font-size:13px; font-weight:600;}
  .icon-btn{background:var(--panel); border:1px solid var(--line); color:var(--text); width:38px; height:38px; border-radius:10px; font-size:18px; cursor:pointer; flex-shrink:0;}

  .tabs{display:flex; gap:6px; padding:12px 16px 4px;}
  .tab{flex:1; text-align:center; padding:9px 0; border-radius:10px; font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); background:transparent; border:1px solid var(--line); cursor:pointer;}
  .tab.active{background:var(--panel-2); color:var(--text); border-color:var(--accent);}

  main{flex:1; padding:8px 16px 100px; overflow-y:auto;}

  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(72px,1fr)); gap:9px; margin-top:8px;}
  .tile{
    aspect-ratio:1/1; border-radius:12px; border:1px solid var(--line);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    cursor:pointer; position:relative; background:var(--panel);
    transition:transform .08s ease;
  }
  .tile:active{transform:scale(.94);}
  .tile.available{background:var(--signal-dim); border-color:#2a6a48;}
  .tile.out{background:var(--out-dim); border-color:#8a6a24;}
  .tile .id{font-family:var(--mono); font-size:18px; font-weight:700;}
  .tile.available .id{color:var(--signal);}
  .tile.out .id{color:var(--out);}
  .tile .bars{display:flex; gap:2px; margin-top:4px;}
  .bar{width:3px; border-radius:1px; background:currentColor; opacity:.85;}
  .tile.available .bars{color:var(--signal);}
  .tile.out .bars{color:var(--out);}

  .empty{text-align:center; color:var(--muted); padding:40px 20px; font-size:13px; line-height:1.6;}

  .list-row{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; margin-bottom:8px; display:flex; align-items:center; gap:12px; cursor:pointer;
  }
  .list-row .idbadge{font-family:var(--mono); font-size:16px; font-weight:700; color:var(--out); background:var(--out-dim); border-radius:8px; width:42px; height:42px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .list-row .info{flex:1; min-width:0;}
  .list-row .name{font-weight:600; font-size:14px;}
  .list-row .sub{font-size:11.5px; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .list-row .elapsed{font-family:var(--mono); font-size:12px; color:var(--out); text-align:right; flex-shrink:0;}

  .fab{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:var(--accent); color:#08131f; border:none; padding:13px 22px; border-radius:999px;
    font-weight:700; font-size:13px; letter-spacing:.03em; box-shadow:0 8px 24px rgba(0,0,0,.4); cursor:pointer;
    max-width:calc(720px - 32px); width:calc(100% - 32px);
  }

  .sheet-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:50; display:none;}
  .sheet-backdrop.show{display:block;}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:51; background:var(--panel);
    border-radius:20px 20px 0 0; border-top:1px solid var(--line); padding:18px 18px calc(20px + env(safe-area-inset-bottom));
    max-height:88vh; overflow-y:auto; transform:translateY(100%); transition:transform .25s ease;
    max-width:720px; margin:0 auto;
  }
  .sheet.show{transform:translateY(0);}
  .sheet-handle{width:36px; height:4px; background:var(--line); border-radius:3px; margin:0 auto 14px;}
  .sheet h2{font-size:17px; margin:0 0 4px;}
  .sheet .meta{color:var(--muted); font-size:12.5px; margin-bottom:16px;}
  label{display:block; font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:14px 0 6px;}
  input[type=text], input[type=tel], select{
    width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text);
    padding:12px 13px; border-radius:10px; font-size:15px; font-family:var(--sans);
  }
  input:focus, select:focus{outline:none; border-color:var(--accent);}
  canvas.sigpad{width:100%; height:130px; background:var(--bg); border:1px solid var(--line); border-radius:10px; touch-action:none;}
  .sig-actions{display:flex; justify-content:flex-end; margin-top:6px;}
  .link-btn{background:none; border:none; color:var(--accent); font-size:12px; font-weight:600; cursor:pointer; padding:4px;}
  .btn{width:100%; padding:14px; border-radius:12px; border:none; font-weight:700; font-size:14.5px; margin-top:20px; cursor:pointer;}
  .btn-primary{background:var(--signal); color:#08160e;}
  .btn-danger{background:var(--danger); color:#2a0808;}
  .btn-ghost{background:var(--panel-2); color:var(--text); border:1px solid var(--line);}
  .detail-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0;}
  .detail-item{background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 12px;}
  .detail-item .k{font-size:10px; text-transform:uppercase; color:var(--muted); letter-spacing:.06em;}
  .detail-item .v{font-size:13.5px; font-weight:600; margin-top:3px;}
  .sig-preview{background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:8px; margin-top:4px;}
  .sig-preview img{width:100%; display:block;}
  .toast{
    position:fixed; top:16px; left:50%; transform:translateX(-50%); background:var(--panel-2); border:1px solid var(--line);
    padding:10px 18px; border-radius:999px; font-size:12.5px; font-weight:600; z-index:60; opacity:0; transition:opacity .3s;
    pointer-events:none;
  }
  .toast.show{opacity:1;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

  .report-stats{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:10px 0 16px;}
  .report-stats .stat .num{font-size:20px;}
  .report-table{width:100%; border-collapse:collapse; font-size:12.5px;}
  .report-table th{text-align:left; color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.05em; padding:6px 8px; border-bottom:1px solid var(--line);}
  .report-table td{padding:8px 8px; border-bottom:1px solid var(--line); vertical-align:top;}
  .report-table tr:last-child td{border-bottom:none;}
  .status-pill{display:inline-block; padding:2px 8px; border-radius:999px; font-size:10.5px; font-weight:700;}
  .status-pill.returned{background:var(--signal-dim); color:var(--signal);}
  .status-pill.out{background:var(--out-dim); color:var(--out);}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="brand-left"><span class="dot"></span><h1>Channel Log</h1></div>
      <button class="settings-btn" onclick="openSettings()">⚙</button>
    </div>
    <div class="stats">
      <div class="stat avail"><div class="num" id="statAvail">0</div><div class="lbl">Available</div></div>
      <div class="stat out"><div class="num" id="statOut">0</div><div class="lbl">Issued</div></div>
      <div class="stat"><div class="num" id="statTotal">0</div><div class="lbl">Total units</div></div>
    </div>
  </header>

  <div class="event-bar">
    <select id="eventSelect" class="event-select" onchange="onEventChange()"></select>
    <button class="icon-btn" onclick="openNewEvent()">+</button>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="grid" onclick="switchTab('grid')">Units</button>
    <button class="tab" data-tab="issued" onclick="switchTab('issued')">Issued</button>
    <button class="tab" data-tab="reports" onclick="switchTab('reports')">Reports</button>
  </div>

  <main id="main"></main>

  <button class="fab" id="fabExport">Export (.csv)</button>
</div>

<div class="sheet-backdrop" id="backdrop" onclick="closeAllSheets()"></div>

<!-- Issue sheet -->
<div class="sheet" id="issueSheet">
  <div class="sheet-handle"></div>
  <h2>Issue unit <span id="issueUnitId"></span></h2>
  <div class="meta">Event: <span id="issueEventName"></span></div>
  <label>Renter name</label>
  <input type="text" id="renterName" placeholder="Full name">
  <label>Contact number</label>
  <input type="tel" id="renterPhone" placeholder="07X XXX XXXX">
  <label>Signature</label>
  <canvas class="sigpad" id="sigCanvas"></canvas>
  <div class="sig-actions"><button class="link-btn" onclick="clearSig()">Clear signature</button></div>
  <button class="btn btn-primary" onclick="confirmIssue()">Confirm issue — start now</button>
  <button class="btn btn-ghost" onclick="closeAllSheets()">Cancel</button>
</div>

<!-- Detail / return sheet -->
<div class="sheet" id="detailSheet">
  <div class="sheet-handle"></div>
  <h2>Unit <span id="detailUnitId"></span></h2>
  <div class="meta" id="detailEventName"></div>
  <div class="detail-grid">
    <div class="detail-item"><div class="k">Renter</div><div class="v" id="detailName">—</div></div>
    <div class="detail-item"><div class="k">Contact</div><div class="v" id="detailPhone">—</div></div>
    <div class="detail-item"><div class="k">Issued at</div><div class="v" id="detailIssueTime">—</div></div>
    <div class="detail-item"><div class="k">Time out</div><div class="v" id="detailElapsed">—</div></div>
  </div>
  <div class="sig-preview" id="sigPreviewWrap" style="display:none;">
    <img id="sigPreviewImg">
  </div>
  <button class="btn btn-primary" onclick="confirmReturn()">Mark returned now</button>
  <button class="btn btn-ghost" onclick="closeAllSheets()">Close</button>
</div>

<!-- New event sheet -->
<div class="sheet" id="eventSheet">
  <div class="sheet-handle"></div>
  <h2>New event</h2>
  <label>Event name</label>
  <input type="text" id="newEventName" placeholder="e.g. Concert — City Hall">
  <label>Units required</label>
  <input type="text" id="newEventCount" placeholder="e.g. 30" inputmode="numeric">
  <button class="btn btn-primary" onclick="createEvent()">Create & switch to this event</button>
  <button class="btn btn-ghost" onclick="closeAllSheets()">Cancel</button>
</div>

<!-- Settings sheet -->
<div class="sheet" id="settingsSheet">
  <div class="sheet-handle"></div>
  <h2>Settings</h2>
  <label>Total walkie-talkies owned</label>
  <input type="text" id="totalUnitsInput" inputmode="numeric">
  <div class="row2">
    <button class="btn btn-primary" onclick="saveTotalUnits()">Save</button>
    <button class="btn btn-ghost" onclick="closeAllSheets()">Close</button>
  </div>
  <button class="btn btn-danger" onclick="wipeAllData()">Erase all data</button>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------- crash visibility ---------- */
window.onerror = function(msg, src, line){
  try{
    let banner = document.getElementById('errBanner');
    if(!banner){
      banner = document.createElement('div');
      banner.id = 'errBanner';
      banner.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#ff5c5c;color:#2a0808;font-size:11px;padding:8px 12px;z-index:9999;font-family:monospace;white-space:pre-wrap;';
      document.body.appendChild(banner);
    }
    banner.textContent = 'Error: ' + msg + ' (line ' + line + ')';
  }catch(e){}
};

/* ---------- storage ---------- */
const DB_KEY = 'walkieTrackerDB_v1';
let storageOK = true;
function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw){ try{ return JSON.parse(raw); }catch(e){} }
  } catch(e){ storageOK = false; }
  return { totalUnits: 100, units:{}, events:[], activeEventId:null, history:[] };
}
function saveDB(){
  try{
    localStorage.setItem(DB_KEY, JSON.stringify(db));
  } catch(e){
    if(storageOK){
      storageOK = false;
      toast('This browser is blocking saved data — everything works, but resets on reopen');
    }
  }
}
let db = loadDB();

function ensureUnits(){
  for(let i=1;i<=db.totalUnits;i++){
    const id = String(i);
    if(!db.units[id]){
      db.units[id] = { status:'available', name:null, phone:null, eventId:null, eventName:null, issueTime:null, sig:null };
    }
  }
  // trim units beyond new total (keep history but they just won't render)
}
ensureUnits();
if(db.events.length === 0){
  const ev = {id:'ev_'+Date.now(), name:'General / walk-in', required:null, created:Date.now()};
  db.events.push(ev);
  db.activeEventId = ev.id;
  saveDB();
}

if(!db.history) db.history = [];

let currentTab = 'grid';
let pendingUnitId = null;
let currentReportEventId = db.activeEventId;

/* ---------- helpers ---------- */
function fmtTime(ts){
  if(!ts) return '—';
  const d = new Date(ts);
  return d.toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
}
function elapsedStr(ts){
  const diff = Date.now() - ts;
  const mins = Math.floor(diff/60000);
  const h = Math.floor(mins/60), m = mins%60;
  return h>0 ? `${h}h ${m}m` : `${m}m`;
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}
function getEvent(id){ return db.events.find(e=>e.id===id); }

/* ---------- render ---------- */
function renderEventSelect(){
  const sel = document.getElementById('eventSelect');
  sel.innerHTML = db.events.slice().reverse().map(e=>{
    const req = e.required ? ` (${e.required} needed)` : '';
    return `<option value="${e.id}" ${e.id===db.activeEventId?'selected':''}>${e.name}${req}</option>`;
  }).join('');
}
function onEventChange(){
  db.activeEventId = document.getElementById('eventSelect').value;
  saveDB(); render();
}
function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===tab));
  render();
}
function updateFabVisibility(){
  const fab = document.getElementById('fabExport');
  if(currentTab === 'issued'){
    fab.style.display = 'block';
    fab.textContent = 'Export currently issued (.csv)';
    fab.onclick = exportCurrentlyIssuedCSV;
  } else if(currentTab === 'reports'){
    fab.style.display = 'block';
    fab.textContent = 'Export this event report (.csv)';
    fab.onclick = ()=>exportEventReportCSV(currentReportEventId);
  } else {
    fab.style.display = 'none';
  }
}

function render(){
  renderEventSelect();
  const ids = Object.keys(db.units).map(Number).sort((a,b)=>a-b).map(String);
  const avail = ids.filter(id=>db.units[id].status==='available').length;
  const out = ids.filter(id=>db.units[id].status==='out').length;
  document.getElementById('statAvail').textContent = avail;
  document.getElementById('statOut').textContent = out;
  document.getElementById('statTotal').textContent = ids.length;

  const main = document.getElementById('main');
  if(currentTab === 'grid'){
    main.innerHTML = `<div class="grid">${ids.map(id=>{
      const u = db.units[id];
      const cls = u.status==='out' ? 'out' : 'available';
      return `<div class="tile ${cls}" onclick="tileClick('${id}')">
        <div class="id">${id.padStart(2,'0')}</div>
        <div class="bars"><span class="bar" style="height:4px"></span><span class="bar" style="height:7px"></span><span class="bar" style="height:10px"></span></div>
      </div>`;
    }).join('')}</div>`;
  } else if(currentTab === 'issued') {
    const outUnits = ids.filter(id=>db.units[id].status==='out')
      .sort((a,b)=>db.units[a].issueTime - db.units[b].issueTime);
    if(outUnits.length===0){
      main.innerHTML = `<div class="empty">No units currently out.<br>Everything's back at base.</div>`;
    } else {
      main.innerHTML = outUnits.map(id=>{
        const u = db.units[id];
        return `<div class="list-row" onclick="openDetail('${id}')">
          <div class="idbadge">${id}</div>
          <div class="info">
            <div class="name">${u.name||'—'}</div>
            <div class="sub">${u.phone||'—'} · ${u.eventName||''}</div>
          </div>
          <div class="elapsed">${elapsedStr(u.issueTime)}<br>out</div>
        </div>`;
      }).join('');
    }
  } else if(currentTab === 'reports') {
    if(!currentReportEventId || !getEvent(currentReportEventId)) currentReportEventId = db.activeEventId;
    main.innerHTML = `
      <label style="margin-top:0;">Event</label>
      <select id="reportEventSelect" class="event-select" style="width:100%;" onchange="onReportEventChange()">
        ${db.events.slice().reverse().map(e=>`<option value="${e.id}" ${e.id===currentReportEventId?'selected':''}>${e.name}</option>`).join('')}
      </select>
      <div id="reportBody"></div>
    `;
    renderReportBody();
  }
  updateFabVisibility();
}

function onReportEventChange(){
  currentReportEventId = document.getElementById('reportEventSelect').value;
  renderReportBody();
  updateFabVisibility();
}

function renderReportBody(){
  const body = document.getElementById('reportBody');
  if(!body) return;
  const ev = getEvent(currentReportEventId);
  const txs = db.history.filter(t=>t.eventId===currentReportEventId).sort((a,b)=>a.issueTime-b.issueTime);
  const issuedCount = txs.length;
  const returnedCount = txs.filter(t=>t.returnTime).length;
  const stillOut = issuedCount - returnedCount;
  const required = ev && ev.required ? ev.required : null;

  body.innerHTML = `
    <div class="report-stats">
      <div class="stat"><div class="num">${required ?? '—'}</div><div class="lbl">Required</div></div>
      <div class="stat"><div class="num">${issuedCount}</div><div class="lbl">Units used</div></div>
      <div class="stat avail"><div class="num">${returnedCount}</div><div class="lbl">Returned</div></div>
      <div class="stat out"><div class="num">${stillOut}</div><div class="lbl">Still out</div></div>
    </div>
    ${txs.length===0 ? `<div class="empty">No units have been issued under this event yet.</div>` : `
    <table class="report-table">
      <thead><tr><th>ID</th><th>Renter</th><th>Contact</th><th>Issued</th><th>Returned</th><th>Status</th></tr></thead>
      <tbody>
        ${txs.map(t=>`
          <tr>
            <td>#${t.unitId}</td>
            <td>${t.name||'—'}</td>
            <td>${t.phone||'—'}</td>
            <td>${fmtTime(t.issueTime)}</td>
            <td>${t.returnTime ? fmtTime(t.returnTime) : '—'}</td>
            <td>${t.returnTime ? '<span class="status-pill returned">Returned</span>' : '<span class="status-pill out">Out</span>'}</td>
          </tr>`).join('')}
      </tbody>
    </table>`}
  `;
}

/* ---------- issue flow ---------- */
let sigCtx, drawing=false, sigHasContent=false;
function setupSigCanvas(){
  const canvas = document.getElementById('sigCanvas');
  const ratio = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * ratio;
  canvas.height = rect.height * ratio;
  sigCtx = canvas.getContext('2d');
  sigCtx.scale(ratio, ratio);
  sigCtx.strokeStyle = '#eef1f6';
  sigCtx.lineWidth = 2.2;
  sigCtx.lineCap = 'round';
  sigHasContent = false;
  const pos = (e)=>{
    const r = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return {x:t.clientX-r.left, y:t.clientY-r.top};
  };
  const start = (e)=>{ drawing=true; const p=pos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x,p.y); e.preventDefault(); };
  const move = (e)=>{ if(!drawing) return; const p=pos(e); sigCtx.lineTo(p.x,p.y); sigCtx.stroke(); sigHasContent=true; e.preventDefault(); };
  const end = ()=>{ drawing=false; };
  canvas.onmousedown=start; canvas.onmousemove=move; canvas.onmouseup=end; canvas.onmouseleave=end;
  canvas.ontouchstart=start; canvas.ontouchmove=move; canvas.ontouchend=end;
}
function clearSig(){
  const canvas = document.getElementById('sigCanvas');
  sigCtx.clearRect(0,0,canvas.width,canvas.height);
  sigHasContent = false;
}

function tileClick(id){
  const u = db.units[id];
  if(u.status === 'available'){ openIssue(id); } else { openDetail(id); }
}
function openIssue(id){
  pendingUnitId = id;
  document.getElementById('issueUnitId').textContent = '#'+id;
  const ev = getEvent(db.activeEventId);
  document.getElementById('issueEventName').textContent = ev ? ev.name : '—';
  document.getElementById('renterName').value = '';
  document.getElementById('renterPhone').value = '';
  showSheet('issueSheet');
  setTimeout(setupSigCanvas, 50);
}
function confirmIssue(){
  const name = document.getElementById('renterName').value.trim();
  const phone = document.getElementById('renterPhone').value.trim();
  if(!name || !phone){ toast('Enter renter name and contact number'); return; }
  const ev = getEvent(db.activeEventId);
  const u = db.units[pendingUnitId];
  u.status = 'out'; u.name = name; u.phone = phone;
  u.eventId = db.activeEventId; u.eventName = ev ? ev.name : '';
  u.issueTime = Date.now();
  u.sig = sigHasContent ? document.getElementById('sigCanvas').toDataURL('image/png') : null;
  const tx = { id:'tx_'+Date.now()+'_'+pendingUnitId, unitId: pendingUnitId, eventId: u.eventId, eventName: u.eventName,
               name, phone, issueTime: u.issueTime, returnTime: null };
  db.history.push(tx);
  u.txId = tx.id;
  saveDB(); closeAllSheets(); render();
  toast(`Unit #${pendingUnitId} issued to ${name}`);
}

function openDetail(id){
  pendingUnitId = id;
  const u = db.units[id];
  document.getElementById('detailUnitId').textContent = '#'+id;
  document.getElementById('detailEventName').textContent = u.eventName || '';
  document.getElementById('detailName').textContent = u.name || '—';
  document.getElementById('detailPhone').textContent = u.phone || '—';
  document.getElementById('detailIssueTime').textContent = fmtTime(u.issueTime);
  document.getElementById('detailElapsed').textContent = u.issueTime ? elapsedStr(u.issueTime) : '—';
  const wrap = document.getElementById('sigPreviewWrap');
  if(u.sig){ wrap.style.display='block'; document.getElementById('sigPreviewImg').src = u.sig; }
  else { wrap.style.display='none'; }
  showSheet('detailSheet');
}
function confirmReturn(){
  const u = db.units[pendingUnitId];
  const returnTime = Date.now();
  if(u.txId){
    const tx = db.history.find(t=>t.id===u.txId);
    if(tx) tx.returnTime = returnTime;
  }
  u.status = 'available'; u.name=null; u.phone=null; u.eventId=null; u.eventName=null; u.issueTime=null; u.sig=null; u.txId=null;
  saveDB(); closeAllSheets(); render();
  toast(`Unit #${pendingUnitId} marked returned`);
}

/* ---------- events ---------- */
function openNewEvent(){
  document.getElementById('newEventName').value='';
  document.getElementById('newEventCount').value='';
  showSheet('eventSheet');
}
function createEvent(){
  const name = document.getElementById('newEventName').value.trim();
  const count = parseInt(document.getElementById('newEventCount').value, 10);
  if(!name){ toast('Enter an event name'); return; }
  const ev = {id:'ev_'+Date.now(), name, required: isNaN(count)?null:count, created:Date.now()};
  db.events.push(ev);
  db.activeEventId = ev.id;
  saveDB(); closeAllSheets(); render();
  toast(`Event "${name}" created`);
}

/* ---------- settings ---------- */
function openSettings(){
  document.getElementById('totalUnitsInput').value = db.totalUnits;
  showSheet('settingsSheet');
}
function saveTotalUnits(){
  const n = parseInt(document.getElementById('totalUnitsInput').value, 10);
  if(isNaN(n) || n<1 || n>2000){ toast('Enter a valid number'); return; }
  db.totalUnits = n; ensureUnits(); saveDB(); closeAllSheets(); render();
  toast('Inventory size updated');
}
function wipeAllData(){
  if(!confirm('Erase all units, events and history? This cannot be undone.')) return;
  try{ localStorage.removeItem(DB_KEY); }catch(e){}
  db = loadDB(); ensureUnits();
  const ev = {id:'ev_'+Date.now(), name:'General / walk-in', required:null, created:Date.now()};
  db.events=[ev]; db.activeEventId=ev.id; saveDB();
  closeAllSheets(); render();
}

/* ---------- export ---------- */
function downloadCSV(csv, filename){
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}
function exportCurrentlyIssuedCSV(){
  const ids = Object.keys(db.units).filter(id=>db.units[id].status==='out');
  if(ids.length===0){ toast('Nothing currently issued to export'); return; }
  let csv = 'Unit ID,Renter Name,Contact Number,Event,Issue Time\n';
  ids.forEach(id=>{
    const u = db.units[id];
    csv += `${id},"${u.name||''}","${u.phone||''}","${u.eventName||''}","${fmtTime(u.issueTime)}"\n`;
  });
  downloadCSV(csv, `issued-units-${new Date().toISOString().slice(0,10)}.csv`);
}
function exportEventReportCSV(eventId){
  const ev = getEvent(eventId);
  const txs = db.history.filter(t=>t.eventId===eventId).sort((a,b)=>a.issueTime-b.issueTime);
  if(txs.length===0){ toast('No history for this event yet'); return; }
  let csv = `Event,${(ev?ev.name:'').replace(/,/g,' ')}\n`;
  if(ev && ev.required) csv += `Units required,${ev.required}\n`;
  csv += `Units used,${txs.length}\n`;
  csv += `Returned,${txs.filter(t=>t.returnTime).length}\n`;
  csv += `Still out,${txs.filter(t=>!t.returnTime).length}\n\n`;
  csv += 'Unit ID,Renter Name,Contact Number,Issue Time,Return Time,Status\n';
  txs.forEach(t=>{
    csv += `${t.unitId},"${t.name||''}","${t.phone||''}","${fmtTime(t.issueTime)}","${t.returnTime?fmtTime(t.returnTime):''}","${t.returnTime?'Returned':'Out'}"\n`;
  });
  const safeName = (ev?ev.name:'event').replace(/[^a-z0-9]+/gi,'-').toLowerCase();
  downloadCSV(csv, `event-report-${safeName}.csv`);
}

/* ---------- sheets ---------- */
function showSheet(id){
  document.getElementById('backdrop').classList.add('show');
  document.getElementById(id).classList.add('show');
}
function closeAllSheets(){
  document.getElementById('backdrop').classList.remove('show');
  document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('show'));
}

/* ---------- live elapsed refresh ---------- */
setInterval(()=>{ if(currentTab==='issued' || currentTab==='reports') render(); }, 30000);

render();
</script>
</body>
</html>
